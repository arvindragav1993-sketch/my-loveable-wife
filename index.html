<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Love Story ❤️</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: black;
    color: white;
}

/* CINEMATIC BACKGROUND VIDEO */
#bgVideo {
    position: fixed;
    right: 0;
    bottom: 0;
    min-width: 100%;
    min-height: 100%;
    opacity: 0.35;
    z-index: -1;
}

/* CENTER CONTENT */
.container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
}

h1 {
    font-size: 42px;
    text-shadow: 0 0 20px #ff1493;
}

p {
    font-size: 18px;
    max-width: 600px;
    opacity: 0;
    animation: fadeIn 3s forwards;
    animation-delay: 2s;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

/* BUTTON */
button {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    background: #ff1493;
    color: white;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

/* LOVE LETTER OVERLAY */
#letter {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
}

#letterBox {
    max-width: 500px;
    background: white;
    color: black;
    padding: 20px;
    border-radius: 15px;
}
</style>
</head>

<body>

<!-- CINEMATIC VIDEO BACKGROUND -->
<video autoplay muted loop id="bgVideo">
    <source src="love.mp4" type="video/mp4">
</video>

<!-- MAIN -->
<div class="container">
    <h1>💖 Our Cinematic Love Story 💖</h1>
    <p>
        Every moment with you feels like a movie…  
        a story I never want to end ❤️
    </p>

    <button onclick="openLetter()">💌 Open Love Letter</button>
</div>

<!-- LETTER -->
<div id="letter" onclick="closeLetter()">
    <div id="letterBox">
        <h2>To My Love ❤️</h2>
        <p>
            You are not just a part of my life…  
            you are my entire story, my happiness, my forever.  
            No matter where life goes, I will always choose you. ❤️
        </p>
        <br>
        <small>(Click anywhere to close)</small>
    </div>
</div>

<script>
function openLetter() {
    document.getElementById("letter").style.display = "flex";
}

function closeLetter() {
    document.getElementById("letter").style.display = "none";
}
</script>

</body>
</html>
