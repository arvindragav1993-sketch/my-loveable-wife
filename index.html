<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Love Story ❤️</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: black;
    color: white;
}

/* BACKGROUND VIDEO */
#bgVideo {
    position: fixed;
    right: 0;
    bottom: 0;
    min-width: 100%;
    min-height: 100%;
    opacity: 0.35;
    z-index: -1;
}

/* MAIN CONTAINER */
.container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
}

/* TITLE */
h1 {
    font-size: 42px;
    text-shadow: 0 0 20px #ff1493;
}

/* TEXT */
p {
    font-size: 18px;
    max-width: 600px;
    opacity: 0;
    animation: fadeIn 3s forwards;
    animation-delay: 2s;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

/* BUTTON */
button {
    margin-top: 20px;
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    background: #ff1493;
    color: white;
    cursor: pointer;
    font-size: 16px;
    transition: 0.3s;
}

button:hover {
    transform: scale(1.05);
}

/* INPUT */
input {
    margin-top: 15px;
}

/* IMAGE */
img {
    width: 250px;
    margin-top: 15px;
    border-radius: 15px;
    display: none;
    box-shadow: 0 0 20px #ff1493;
}

/* LOVE LETTER */
#letter {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    display: none;
    justify-content: center;
    align-items: center;
}

#letterBox {
    max-width: 500px;
    background: white;
    color: black;
    padding: 20px;
    border-radius: 15px;
}
</style>
</head>

<body>

<!-- BACKGROUND VIDEO -->
<video autoplay muted loop id="bgVideo">
    <source src="love.mp4" type="video/mp4">
</video>

<!-- MAIN CONTENT -->
<div class="container">

    <h1>💖 Our Cinematic Love Story 💖</h1>

    <p>
        Every moment with you feels like a movie…  
        a story I never want to end ❤️
    </p>

    <button onclick="openLetter()">💌 Open Love Letter</button>

    <!-- UPLOAD -->
    <input type="file" id="photo">

    <button onclick="uploadImage()">Upload Memory ❤️</button>

    <img id="preview">

</div>

<!-- LOVE LETTER -->
<div id="letter" onclick="closeLetter()">
    <div id="letterBox">
        <h2>To My Love ❤️</h2>
        <p>
            You are my happiness, my peace, my forever.  
            No matter what happens, I will always choose you ❤️
        </p>
        <small>(Click anywhere to close)</small>
    </div>
</div>

<!-- SCRIPT -->
<script>
function openLetter() {
    document.getElementById("letter").style.display = "flex";
}

function closeLetter() {
    document.getElementById("letter").style.display = "none";
}

/* CLOUDINARY SETUP */
const cloudName = "cccw6q8r";
const uploadPreset = "ml_upload";

function uploadImage() {
    const file = document.getElementById("photo").files[0];

    if (!file) {
        alert("Please select an image ❤️");
        return;
    }

    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", uploadPreset);

    fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`, {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("preview").src = data.secure_url;
        document.getElementById("preview").style.display = "block";
        alert("Upload Successful ❤️");
    })
    .catch(err => {
        console.log(err);
        alert("Upload Failed ❌");
    });
}
</script>

</body>
</html>
