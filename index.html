<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>💖 My Love Universe Pro Max</title>

<style>
body{
margin:0;
font-family:Arial;
background:black;
color:white;
}

.bg{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(-45deg,#ff0066,#6600ff,#00ffcc,#ffcc00);
background-size:400% 400%;
animation:move 8s infinite;
z-index:-1;
}

@keyframes move{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

header{
text-align:center;
padding:20px;
font-size:26px;
font-weight:bold;
}

.loginBox{
text-align:center;
margin-top:30px;
}

button{
padding:10px 20px;
border:none;
border-radius:20px;
background:#ff1493;
color:white;
cursor:pointer;
margin:5px;
}

#content{
display:none;
text-align:center;
margin-top:20px;
}
</style>
</head>

<body>

<div class="bg"></div>

<header>💖 My Love Universe Pro Max 💖</header>

<div class="loginBox" id="loginBox">
<h3>🔐 Owner Login</h3>

<input id="user" placeholder="Username"><br><br>
<input id="pass" type="password" placeholder="Password"><br><br>

<button onclick="login()">Login</button>
</div>

<div id="content">
<h2>💖 Welcome Owner 💖</h2>
<p>You are inside your private site</p>

<button onclick="logout()">Logout</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

<script>

/* 🔥 FIREBASE CONFIG (PUT YOUR REAL DETAILS FROM FIREBASE) */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();

/* 🔐 LOGIN */
function login(){
let email = document.getElementById("user").value;
let pass = document.getElementById("pass").value;

auth.signInWithEmailAndPassword(email, pass)
.then(()=>{
document.getElementById("loginBox").style.display="none";
document.getElementById("content").style.display="block";
})
.catch(err=>{
alert("❌ "+err.message);
});
}

/* 🚪 LOGOUT */
function logout(){
auth.signOut().then(()=>{
document.getElementById("loginBox").style.display="block";
document.getElementById("content").style.display="none";
document.getElementById("user").value="";
document.getElementById("pass").value="";
});
}

/* 🔄 AUTO LOGIN CHECK (IMPORTANT PRO FEATURE) */
auth.onAuthStateChanged(user=>{
if(user){
document.getElementById("loginBox").style.display="none";
document.getElementById("content").style.display="block";
}else{
document.getElementById("loginBox").style.display="block";
document.getElementById("content").style.display="none";
}
});
</script>
</body>
</html>
