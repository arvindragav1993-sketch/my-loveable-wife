<!DOCTYPE html>
<html>
<head>
<title>My Private Love World ❤️</title>

<style>
body{
margin:0;
font-family:Arial;
background:black;
color:white;
text-align:center;
overflow-x:hidden;
}

.bg{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(45deg,#ff0066,#6600ff,#00ffcc);
background-size:400% 400%;
animation:move 10s infinite;
z-index:-1;
}

@keyframes move{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

.container{
margin-top:80px;
}

button{
padding:10px 20px;
border:none;
border-radius:20px;
margin:5px;
cursor:pointer;
background:#ff1493;
color:white;
}

input{
margin:10px;
}

img{
width:150px;
margin:10px;
border-radius:10px;
}

.music{
margin-top:20px;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

<h1>💖 My Private Love World 💖</h1>

<button onclick="login()">Admin Login</button>
<button onclick="logout()">Logout</button>

<br><br>

<input type="file" id="photo">
<button onclick="addPhoto()">Upload Photo 📸</button>

<br>

<input type="file" id="music">
<button onclick="addMusic()">Upload Music 🎵</button>

<div class="music" id="musicPlayer"></div>

<div id="gallery"></div>

</div>

<script>

let isAdmin = false;
const PASSWORD = "love123";

// LOGIN SYSTEM
function login(){
let pass = prompt("Enter password:");
if(pass === PASSWORD){
isAdmin = true;
alert("Access granted ❤️");
}else{
alert("Wrong password ❌");
}
}

function logout(){
isAdmin = false;
alert("Logged out");
}

// PHOTO
function addPhoto(){
if(!isAdmin){
alert("Only admin can upload ❤️");
return;
}

const file = document.getElementById("photo").files[0];
const reader = new FileReader();

reader.onload = function(e){
let img = document.createElement("img");
img.src = e.target.result;
document.getElementById("gallery").appendChild(img);
}

reader.readAsDataURL(file);
}

// MUSIC
function addMusic(){
if(!isAdmin){
alert("Only admin can upload ❤️");
return;
}

const file = document.getElementById("music").files[0];
const url = URL.createObjectURL(file);

let audio = document.createElement("audio");
audio.controls = true;
audio.src = url;

document.getElementById("musicPlayer").appendChild(audio);
}

</script>

</body>
</html>
