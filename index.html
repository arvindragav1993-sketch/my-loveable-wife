<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>💖 My Love Universe Pro Max</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<style>
body{
margin:0;
font-family:Arial;
background:black;
color:white;
overflow-x:hidden;
}

/* CINEMATIC BACKGROUND */
.bg{
position:fixed;
width:100%;
height:100%;
background:linear-gradient(-45deg,#ff0066,#6600ff,#00ffcc,#ffcc00);
background-size:400% 400%;
animation:move 8s infinite;
z-index:-2;
}

@keyframes move{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* HEADER */
header{
text-align:center;
padding:20px;
font-size:28px;
font-weight:bold;
text-shadow:0 0 20px #ff1493;
}

/* LOGIN PANEL */
.loginBox{
text-align:center;
margin-top:10px;
}

/* BUTTONS */
button{
padding:10px 18px;
margin:5px;
border:none;
border-radius:20px;
background:#ff1493;
color:white;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
}

/* UPLOAD */
.uploadBox{
text-align:center;
margin-top:20px;
}

/* GALLERY (INSTAGRAM STYLE) */
.gallery{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
gap:10px;
padding:20px;
}

.gallery img{
width:100%;
height:120px;
object-fit:cover;
border-radius:12px;
box-shadow:0 0 10px black;
transition:0.3s;
}

.gallery img:hover{
transform:scale(1.05);
}

/* MUSIC */
audio{
width:90%;
margin:10px;
}
</style>
</head>

<body>

<div class="bg"></div>

<header>💖 My Love Universe Pro Max 💖</header>

<div class="loginBox">
<button onclick="login()">Login (Owner Only)</button>
<button onclick="logout()">Logout</button>
</div>

<div class="uploadBox">
<input type="file" id="fileImg">
<button onclick="uploadImage()">Upload Photo 📸</button>

<br>

<input type="file" id="fileMusic">
<button onclick="uploadMusic()">Upload Music 🎵</button>
</div>

<h3 style="text-align:center;">💖 Memory Gallery</h3>
<div class="gallery" id="gallery"></div>

<h3 style="text-align:center;">🎵 Music Zone</h3>
<div id="music"></div>

<div id="status" style="text-align:center;"></div>

<script>

/* 🔥 FIREBASE CONFIG (PUT YOURS) */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_AUTH_DOMAIN",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_STORAGE_BUCKET",
  appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const storage = firebase.storage();

/* LOGIN */
function login(){
let email = prompt("Email:");
let pass = prompt("Password:");

auth.signInWithEmailAndPassword(email, pass)
.then(()=>{
document.getElementById("status").innerHTML="💖 Logged in as Owner";
loadFiles();
})
.catch(e=>alert(e.message));
}

/* LOGOUT */
function logout(){
auth.signOut();
document.getElementById("status").innerHTML="Logged out";
}

/* UPLOAD IMAGE */
function uploadImage(){
if(!auth.currentUser){
alert("Only owner can upload ❤️");
return;
}

let file=document.getElementById("fileImg").files[0];
if(!file){alert("Select image");return;}

let ref=storage.ref("love/images/"+file.name);

ref.put(file).then(()=>{
loadFiles();
});
}

/* UPLOAD MUSIC */
function uploadMusic(){
if(!auth.currentUser){
alert("Only owner can upload ❤️");
return;
}

let file=document.getElementById("fileMusic").files[0];
if(!file){alert("Select music");return;}

let ref=storage.ref("love/music/"+file.name);

ref.put(file).then(()=>{
loadFiles();
});
}

/* LOAD FILES */
function loadFiles(){

// IMAGES
storage.ref("love/images").listAll().then(res=>{
document.getElementById("gallery").innerHTML="";
res.items.forEach(item=>{
item.getDownloadURL().then(url=>{
let img=document.createElement("img");
img.src=url;
document.getElementById("gallery").appendChild(img);
});
});
});

// MUSIC
storage.ref("love/music").listAll().then(res=>{
document.getElementById("music").innerHTML="";
res.items.forEach(item=>{
item.getDownloadURL().then(url=>{
let audio=document.createElement("audio");
audio.controls=true;
audio.src=url;
document.getElementById("music").appendChild(audio);
});
});
});

}

loadFiles();

</script>

</body>
</html>
